name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run check
      - name: Electron fixture tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
      - name: Electron fixture tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:ui
      - name: Build native installer
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
