name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use runner browsers
        shell: bash
        run: |
          WIPEDITT_CHROME=$(command -v google-chrome)
          WIPEDITT_EXTENSION_CHROME=$(command -v chromium || command -v chromium-browser)
          test -n "$WIPEDITT_CHROME"
          test -n "$WIPEDITT_EXTENSION_CHROME"
          echo "WIPEDITT_CHROME=$WIPEDITT_CHROME" >> "$GITHUB_ENV"
          echo "WIPEDITT_EXTENSION_CHROME=$WIPEDITT_EXTENSION_CHROME" >> "$GITHUB_ENV"
          "$WIPEDITT_CHROME" --version
          "$WIPEDITT_EXTENSION_CHROME" --version
      - run: npm run check
      - run: npm run test:ui
      - name: Validate committed runtime
        run: git diff --exit-code -- wipeditt.user.js
