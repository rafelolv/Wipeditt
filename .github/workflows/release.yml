name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import p from './package.json' with {type:'json'}; if (process.env.RELEASE_TAG !== 'v' + p.version) process.exit(1)"
      - run: npm ci
      - name: Install matching extension test browser
        timeout-minutes: 5
        run: npx playwright-core install chromium
      - name: Resolve test browsers
        shell: bash
        run: |
          WIPEDITT_CHROME=$(command -v google-chrome)
          WIPEDITT_EXTENSION_CHROME=$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath())")
          test -n "$WIPEDITT_CHROME"
          test -n "$WIPEDITT_EXTENSION_CHROME"
          echo "WIPEDITT_CHROME=$WIPEDITT_CHROME" >> "$GITHUB_ENV"
          echo "WIPEDITT_EXTENSION_CHROME=$WIPEDITT_EXTENSION_CHROME" >> "$GITHUB_ENV"
          "$WIPEDITT_CHROME" --version
          "$WIPEDITT_EXTENSION_CHROME" --version
      - run: npm run check
      - run: npm run test:ui
      - run: git diff --exit-code -- wipeditt.user.js
      - name: Package reviewer source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=Wipeditt/ -o "dist/wipeditt-source-${RELEASE_TAG}.zip" HEAD
          cd dist
          sha256sum "wipeditt-source-${RELEASE_TAG}.zip" >> SHA256SUMS
      - name: Publish technical preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "Wipeditt ${RELEASE_TAG} — Preview" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            dist/wipeditt.user.js dist/wipeditt-chromium-*.zip dist/wipeditt-firefox-*.zip dist/wipeditt-source-*.zip dist/SHA256SUMS
