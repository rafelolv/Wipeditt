name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run check
      - name: Electron fixture tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
      - name: Electron fixture tests (Windows)
        if: runner.os != 'Linux'
        run: npm run test:ui
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node build/check-release.mjs
      - name: Build native installer
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Validate packaged updater
        run: node build/check-updater-package.mjs
      - name: Packaged updater fixture (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/desktop/packaged-updater.mjs
      - name: Packaged updater fixture (Windows)
        if: runner.os != 'Linux'
        run: node test/desktop/packaged-updater.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
  publish:
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Package source and checksum all assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=Wipeditt/ -o "dist/wipeditt-source-${RELEASE_TAG}.zip" HEAD
          node build/checksums.mjs
      - name: Publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag "${release_flags[@]}" \
            --title "Wipeditt ${RELEASE_TAG} — Desktop" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            dist/*.AppImage dist/*.deb dist/*.exe dist/wipeditt-source-*.zip dist/SHA256SUMS
