name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import p from './package.json' with {type:'json'}; if (process.env.RELEASE_TAG !== 'v' + p.version) process.exit(1)"
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Resolve browser
        run: node --input-type=module -e "import { chromium } from 'playwright-core'; console.log('WIPEDITT_CHROME=' + chromium.executablePath()); console.log('WIPEDITT_EXTENSION_CHROME=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm run test:ui
      - run: git diff --exit-code -- wipeditt.user.js
      - name: Package reviewer source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=Wipeditt/ -o "dist/wipeditt-source-${RELEASE_TAG}.zip" HEAD
          cd dist
          sha256sum "wipeditt-source-${RELEASE_TAG}.zip" >> SHA256SUMS
      - name: Publish technical preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "Wipeditt ${RELEASE_TAG} — Technical preview" \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            dist/wipeditt.user.js dist/wipeditt-chromium-*.zip dist/wipeditt-firefox-*.zip dist/wipeditt-source-*.zip dist/SHA256SUMS
